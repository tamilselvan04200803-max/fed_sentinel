<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FedSentinel - Federated AI Security Operations Dashboard</title>
    <meta name="description" content="Evidence-driven security control plane for federated learning. Don't trust the update. Verify it." />
    <meta property="og:title" content="FedSentinel - Federated AI Security Operations Dashboard" />
    <meta property="og:description" content="Evidence-driven security control plane for federated learning. Don't trust the update. Verify it." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#f8fafc] text-[#0f172a] min-h-screen selection:bg-slate-200 selection:text-slate-900 antialiased">
    <div id="root"></div>
    <script>
      // VS Code Live Server (port 5500) detection and auto-redirect to Vite server
      if (window.location.port === '5500' || window.location.protocol === 'file:') {
        fetch('http://localhost:3000')
          .then(function() {
            window.location.href = 'http://localhost:3000';
          })
          .catch(function() {
            setTimeout(function() {
              var root = document.getElementById('root');
              if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
                root.innerHTML = [
                  '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;padding:24px;">',
                  '  <div style="max-width:520px;width:100%;background:#1e293b;border:1px solid #334155;border-radius:12px;padding:28px;box-shadow:0 20px 40px rgba(0,0,0,0.4);">',
                  '    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">',
                  '      <div style="width:38px;height:38px;border-radius:8px;background:#10b981;display:flex;align-items:center;justify-content:center;font-size:20px;">🛡️</div>',
                  '      <div>',
                  '        <h2 style="margin:0;font-size:17px;font-weight:700;color:#f8fafc;">FedSentinel Live Console</h2>',
                  '        <span style="font-size:11px;color:#94a3b8;font-family:monospace;">VS Code Live Server Bridge</span>',
                  '      </div>',
                  '    </div>',
                  '    <p style="font-size:13px;color:#cbd5e1;line-height:1.5;margin-bottom:16px;">',
                  '      FedSentinel is running in a static preview server. For full interactive capabilities with Vite &amp; FastAPI:',
                  '    </p>',
                  '    <div style="background:#0f172a;border:1px solid #334155;border-radius:6px;padding:10px 14px;font-family:monospace;font-size:12px;color:#38bdf8;margin-bottom:18px;">',
                  '      npm run dev &nbsp;&bull;&nbsp; or double click start.bat',
                  '    </div>',
                  '    <div style="display:flex;gap:10px;">',
                  '      <a href="http://localhost:3000" style="flex:1;text-align:center;padding:10px 14px;background:#10b981;color:#0f172a;border-radius:6px;font-weight:700;font-size:13px;text-decoration:none;">',
                  '        Launch at http://localhost:3000',
                  '      </a>',
                  '      <a href="dist/index.html" style="padding:10px 14px;background:#334155;color:#f8fafc;border-radius:6px;font-size:13px;text-decoration:none;">',
                  '        Open Built App',
                  '      </a>',
                  '    </div>',
                  '  </div>',
                  '</div>'
                ].join('');
              }
            }, 1000);
          });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
